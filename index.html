  <script>
    // --- 藍牙狀態 ---
    let bluetoothDevice = null;
    let bluetoothServer = null;
    let printerCharacteristic = null;

    // 熱感應印表機常見的 UUID
    const SERVICE_UUIDS = [
      '000018f0-0000-1000-8000-00805f9b34fb', // Standard POS Service
      '49535343-fe7d-4ae5-8fa9-9fafd205e455', // ISSC
      'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
    ];
    
    const CHUNK_SIZE = 100; // MTU 安全切塊大小

    // --- 日誌工具 ---
    function log(msg, type = 'info') {
      const consoleEl = document.getElementById('logConsole');
      const time = new Date().toLocaleTimeString('en-US', { hour12: false, fractionalSecondDigits: 2 });
      
      const div = document.createElement('div');
      let colorClass = 'text-slate-300';
      if (type === 'error') colorClass = 'text-rose-400 font-bold';
      if (type === 'success') colorClass = 'text-emerald-400';
      if (type === 'warn') colorClass = 'text-amber-300';
      
      div.className = `${colorClass} leading-tight break-all pb-1`;
      div.innerHTML = `<span class="text-slate-500">[${time}]</span> ${msg}`;
      
      consoleEl.appendChild(div);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('logConsole').innerHTML = '';
      log('日誌已清除');
    }

    // --- 初始化檢查 ---
    window.onload = function() {
      const notice = document.getElementById('btSupportNotice');
      if (navigator.bluetooth) {
        notice.textContent = '✔️ Web Bluetooth API 已就緒';
        notice.className = 'text-[11px] text-emerald-400 text-center font-mono mt-1';
        log('藍牙環境檢查通過');
      } else {
        notice.textContent = '❌ 瀏覽器不支援 Web Bluetooth';
        notice.className = 'text-[11px] text-rose-400 text-center font-mono mt-1';
        log('錯誤：請在 iOS 使用 Bluefy 或 Android Chrome 開啟此網頁', 'error');
      }

      if (typeof cptable !== 'undefined') {
        log('CP936 編碼庫 (cpexcel.js) 載入成功', 'success');
      } else {
        log('警告：CP936 編碼庫尚未載入', 'error');
      }
    };

    // --- 藍牙連線邏輯 ---
    async function connectPrinter() {
      if (!navigator.bluetooth) {
        alert("請使用支援 Web Bluetooth 的瀏覽器。");
        return;
      }

      try {
        log('請求藍牙裝置配對 (請選擇 XP-Q90EC)...');
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [...SERVICE_UUIDS, 'generic_access']
        });

        log(`已選擇: ${bluetoothDevice.name || 'Unknown Device'}`, 'success');
        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log('正在連接 GATT 伺服器...');
        bluetoothServer = await bluetoothDevice.gatt.connect();
        
        log('正在尋找寫入特徵值 (Characteristic)...');
        printerCharacteristic = await findWritableCharacteristic(bluetoothServer);

        if (printerCharacteristic) {
          updateUI(true);
          log('✅ 印表機連線準備就緒！', 'success');
        } else {
          throw new Error('未找到支援寫入的藍牙特徵值');
        }
      } catch (err) {
        log(`連線失敗: ${err.message}`, 'error');
        updateUI(false);
      }
    }

    async function findWritableCharacteristic(server) {
      for (let uuid of SERVICE_UUIDS) {
        try {
          const service = await server.getPrimaryService(uuid);
          const chars = await service.getCharacteristics();
          for (let char of chars) {
            if (char.properties.write || char.properties.writeWithoutResponse) {
              log(`找到寫入點 (Service: ${uuid.split('-')[0]})`);
              return char;
            }
          }
        } catch(e) {}
      }
      return null;
    }

    function onDisconnected() {
      log('藍牙連線已中斷', 'warn');
      updateUI(false);
      bluetoothServer = null;
      printerCharacteristic = null;
    }

    function disconnectPrinter() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        log('正在手動中斷連線...');
        bluetoothDevice.gatt.disconnect();
      }
    }

    function updateUI(isConnected) {
      const statusDiv = document.getElementById('connStatus');
      const btnConnect = document.getElementById('btnConnect');
      const btnDisconnect = document.getElementById('btnDisconnect');

      if (isConnected) {
        statusDiv.innerHTML = `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 shadow-inner">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> 已連線
          </span>`;
        btnConnect.classList.add('opacity-50', 'pointer-events-none');
        btnDisconnect.disabled = false;
      } else {
        statusDiv.innerHTML = `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-rose-500/20 text-rose-400 border border-rose-500/30 shadow-inner">
            <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span> 未連線
          </span>`;
        btnConnect.classList.remove('opacity-50', 'pointer-events-none');
        btnDisconnect.disabled = true;
      }
    }

    // --- 列印與排版邏輯 ---

    // 字串長度計算 (中文字算2，英數字算1)
    function getStringWidth(str) {
      let len = 0;
      for (let i = 0; i < str.length; i++) {
        if (str.charCodeAt(i) > 255) len += 2;
        else len += 1;
      }
      return len;
    }

    // 靠右補齊空格
    function padRight(str, totalWidth) {
      const len = getStringWidth(str);
      return len >= totalWidth ? str : str + ' '.repeat(totalWidth - len);
    }

    // 雙欄位排版 (左欄固定寬度，右欄接續)
    function formatTwoColumnsLeftAlign(leftStr, rightStr, leftWidth = 16) {
      return padRight(leftStr, leftWidth) + rightStr + "\n";
    }

    // 雙欄位排版 (一左一右靠邊對齊) - 總寬預設 32
    function formatTwoColumnsSpaceBetween(leftStr, rightStr, totalWidth = 32) {
      const leftLen = getStringWidth(leftStr);
      const rightLen = getStringWidth(rightStr);
      const spaceLen = totalWidth - leftLen - rightLen;
      if (spaceLen > 0) {
        return leftStr + ' '.repeat(spaceLen) + rightStr + "\n";
      }
      return leftStr + " " + rightStr + "\n";
    }

    // 將字串轉為 CP936 (GBK) 的 Uint8Array
    function encodeToCP936(text) {
      if (typeof cptable === 'undefined') throw new Error("CP936 編碼庫未載入");
      const encoded = cptable.utils.encode(936, text);
      return new Uint8Array(encoded);
    }

    // 分塊傳送藍牙資料
    async function sendRawBytes(payloadBytes) {
      if (!printerCharacteristic) {
        alert("請先連線至印表機");
        return false;
      }
      const total = payloadBytes.length;
      let offset = 0;
      log(`開始列印，資料大小: ${total} bytes...`);
      try {
        while (offset < total) {
          const chunk = payloadBytes.slice(offset, offset + CHUNK_SIZE);
          if (printerCharacteristic.properties.writeWithoutResponse) {
            await printerCharacteristic.writeValueWithoutResponse(chunk);
          } else {
            await printerCharacteristic.writeValue(chunk);
          }
          offset += CHUNK_SIZE;
          await new Promise(resolve => setTimeout(resolve, 20));
        }
        log(`✅ 列印指令傳送完成`, 'success');
        return true;
      } catch (err) {
        log(`❌ 傳送失敗: ${err.message}`, 'error');
        return false;
      }
    }

    // 產生並列印預購出單 (套用2欄位排版)
    async function printPreOrderReceipt() {
      if (!printerCharacteristic) {
        log('請先點擊「搜尋並連線」', 'warn');
        return;
      }

      try {
        log('建構 ESC/POS 預購單指令...');
        const payload = [];
        const addBytes = (arr) => { for(let i=0; i<arr.length; i++) payload.push(arr[i]); };

        // 1. 系統設定
        addBytes([0x1B, 0x40]); // 初始化印表機 (ESC @)
        addBytes([0x1C, 0x26]); // 啟用漢字模式 (FS &)

        // 2. 標頭 (置中)
        addBytes([0x1B, 0x61, 0x01]); // 置中對齊
        const headerStr = 
          "================================\n" +
          "         咩味時刻工作室         \n" +
          "       [ 預 購 保 留 單 ]       \n" +
          "================================\n";
        addBytes(encodeToCP936(headerStr));

        // 3. 內文資料 (靠左對齊，雙欄位設計)
        addBytes([0x1B, 0x61, 0x00]); // 靠左對齊
        
        let contentStr = "";
        
        // --- 訂單資訊 (上下標題與數值的雙欄結構) ---
        contentStr += formatTwoColumnsLeftAlign("單號 ORDER NO.", "客戶 CUSTOMER", 17);
        contentStr += formatTwoColumnsLeftAlign("PO-20261003-001", "王小明", 17);
        
        contentStr += formatTwoColumnsLeftAlign("建檔 DATE/TIME", "取貨 PICKUP", 17);
        contentStr += formatTwoColumnsLeftAlign("2026/10/03 20:35", "10/05 14:00", 17);
        
        contentStr += "================================\n";

        // --- 商品列表 (兩端對齊) ---
        contentStr += formatTwoColumnsSpaceBetween("品名 ITEM", "金額 AMT");
        contentStr += "--------------------------------\n";
        contentStr += formatTwoColumnsSpaceBetween("原味山羊乳 x2", "300");
        contentStr += formatTwoColumnsSpaceBetween("草莓山羊乳 x1", "160");
        contentStr += "================================\n";

        // --- 合計區域 (兩端對齊) ---
        contentStr += formatTwoColumnsSpaceBetween("狀態 STATUS :", "已付清");
        contentStr += formatTwoColumnsSpaceBetween("合計AMT. :", "NT$460");
        
        contentStr += "--------------------------------\n";
        addBytes(encodeToCP936(contentStr));

        // 4. 頁尾備註 (置中)
        addBytes([0x1B, 0x61, 0x01]); // 置中對齊
        const footerStr = 
          "* 請憑此單於約定時間取貨 *\n" +
          "感謝您對咩味時刻的支持\n\n\n\n";
        addBytes(encodeToCP936(footerStr));

        // 5. 切紙指令
        addBytes([0x1D, 0x56, 0x42, 0x00]); // 部分切刀

        // 傳送緩衝區
        const finalBuffer = new Uint8Array(payload);
        await sendRawBytes(finalBuffer);
        
      } catch (error) {
        log(`列印錯誤: ${error.message}`, 'error');
      }
    }
  </script>
